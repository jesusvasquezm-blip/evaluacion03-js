<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CaféTec - Gestión de Pedidos</title>
</head>
<body>
  <h1>CaféTec - Registro de Pedidos</h1>
  
  <form id="form-pedido">
    <input id="producto" placeholder="Producto">
    <input id="precio" type="number" step="0.10" placeholder="Precio S/">
    <input id="cantidad" type="number" min="0" placeholder="Cantidad">
    <button type="submit">Agregar</button>
  </form>
  
  <p id="mensaje" style="color: red;"></p>
  
  <select id="filtro">
    <option value="todos">Todos</option>
    <option value="pendiente">Pendientes</option>
    <option value="entregado">Entregados</option>
  </select>
  
  <ul id="lista-pedidos"></ul>
  <p id="total"></p>

  <script src="app.js"></script>
</body>
</html>
